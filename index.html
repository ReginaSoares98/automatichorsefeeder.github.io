<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RS HorseFeeder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--g:#1f3a2c;--g2:#2d5240;--b:#6b4428;--br:#c9a24b;--o:#e8ebe2;--w:#fbfbf7;--t:#1d241f}
*{box-sizing:border-box;margin:0}
body{font:17px/1.6 'Instrument Sans',system-ui,sans-serif;color:var(--t);background:var(--w)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15}
a{color:inherit}
.wrap{max-width:1100px;margin:auto;padding:0 20px}
section{padding:72px 0}
section:nth-of-type(even){background:var(--o)}
h2{font-size:clamp(28px,4vw,40px);color:var(--g);margin-bottom:12px}
.lead{max-width:60ch;margin-bottom:32px}
header{background:var(--g);color:var(--w);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:22px;text-decoration:none}
nav{display:flex;gap:16px;margin-left:auto;font-size:15px}
nav a{text-decoration:none;opacity:.85}nav a:hover{opacity:1;color:var(--br)}
.lang button{background:none;border:1px solid #fff4;color:inherit;padding:3px 8px;border-radius:4px;cursor:pointer;font:inherit;font-size:13px}
.lang button.on{background:var(--br);color:var(--g);border-color:var(--br)}
.hero{background:var(--g);color:var(--w);padding:80px 0 0;overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,68px);margin-bottom:16px}
.hero p{max-width:50ch;opacity:.9;margin-bottom:28px}
.btn{display:inline-block;background:var(--br);color:var(--g);font-weight:600;padding:13px 26px;border-radius:6px;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:600}
.btn:hover{background:#ddb85f}
.btn:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--br);outline-offset:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px}
.cols>div{border-left:4px solid var(--br);padding-left:16px}
.cols h3{font-size:20px;margin-bottom:6px;color:var(--g)}
.tech{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.tech ul{list-style:none;padding:0}
.tech li{padding:9px 0;border-bottom:1px solid #0002}
.tech b{color:var(--b)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:20px}
.card{background:#fff;border:1px solid #0002;border-top:5px solid var(--g2);border-radius:4px;padding:16px;font-size:15px}
.card.al{border-top-color:#b3341f}.card.wa{border-top-color:var(--br)}
.card h3{font-size:20px}
.bar{height:8px;background:#0002;border-radius:4px;margin:6px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g2)}
.log{background:var(--g);color:#dfe8dc;border-radius:4px;padding:14px 18px;font:14px/1.7 ui-monospace,monospace;min-height:130px}
.gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.gal figure{background:#fff;border:1px solid #0002;border-radius:4px;overflow:hidden}
.gal figcaption{padding:10px 14px;font-size:15px}
.gal svg{display:block;width:100%;height:auto}
.buy{display:grid;grid-template-columns:1fr 1fr;gap:36px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input,textarea{width:100%;padding:11px;border:1px solid #0005;border-radius:4px;font:inherit;background:#fff}
.sum{background:var(--g);color:var(--w);padding:24px;border-radius:6px}
.sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #fff2;font-size:15px}
.sum .tot{font-family:Fraunces,serif;font-size:26px;color:var(--br);border:0;padding-top:14px}
.lg{height:46px;width:auto;background:var(--w);border-radius:8px;padding:3px}.plate{background:var(--w);border-radius:50%;width:min(100%,360px);aspect-ratio:1;margin:auto;display:grid;place-items:center}.plate img{width:78%;height:auto}
footer{background:var(--g);color:#cfd9cb;padding:28px 0;font-size:14px;text-align:center}
@media(max-width:800px){.hero .wrap,.tech,.buy{grid-template-columns:1fr}nav{display:none}}
@media(prefers-reduced-motion:no-preference){}
</style>
</head>
